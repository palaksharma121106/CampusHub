# Local full-stack environment: MySQL + FastAPI + React (nginx). Usage: cp .env.example .env && docker compose up --build
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campushub
      MYSQL_USER: campushub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campushub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campushub-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-campushub-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://campushub:${MYSQL_PASSWORD:-campushub}@mysql:3306/campushub
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:?Set FIRST_ADMIN_EMAIL in .env}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?Set FIRST_ADMIN_PASSWORD in .env}
    volumes:
      - uploads:/app/uploads
      - rag-data:/app/data
      - ./docs/sample-documents:/app/sample-documents:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
  uploads:
  rag-data:
